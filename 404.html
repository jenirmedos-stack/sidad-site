<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Página não encontrada — SIDAD</title>
  <meta name="description" content="O endereço acessado não existe ou foi movido. Volte ao início do site da SIDAD.">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/assets/img/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preload" href="/assets/fonts/cabinet-grotesk-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="/assets/js/site.config.js" defer></script>
  <script src="/assets/js/main.js" defer></script>
</head>
<body>
  <div class="scroll-progress" aria-hidden="true"><span id="scroll-progress-bar"></span></div>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="site-header" data-header>
    <div class="nav-glass" data-glass>
      <div class="nav-inner">
        <a class="brand" href="/" aria-label="SIDAD — início">
          <img class="brand-mark" src="/assets/img/logo-mark.png" alt="" width="28" height="20" decoding="async">
          <img class="brand-wordmark" src="/assets/img/logo-wordmark.png" alt="SIDAD" width="112" height="30" decoding="async">
        </a>
        <a class="error-home-link" href="/">Voltar ao início</a>
      </div>
    </div>
  </header>

  <main id="conteudo" class="error-page" tabindex="-1">
    <div class="shell">
      <div class="error-inner">
        <p class="error-code" aria-hidden="true">404</p>
        <h1>Página não encontrada.</h1>
        <p>O endereço que você acessou não existe ou foi movido. Volte ao início para conhecer os serviços da SIDAD.</p>
        <div class="error-actions">
          <a class="btn btn-primary" href="/">
            Voltar ao início
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <a class="btn btn-ghost" href="/#contato">Falar com a SIDAD</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer site-footer--minimal">
    <div class="shell">
      <div class="footer-bottom">
        <p>© <span id="year">2026</span> SIDAD. Todos os direitos reservados.</p>
        <a href="/privacidade.html">Política de Privacidade</a>
      </div>
    </div>
  </footer>
</body>
</html>
